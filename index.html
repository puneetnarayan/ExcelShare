<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ExcelShare</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="authScreen" class="auth-screen"><div class="auth-card"><div class="auth-logo">▦ ExcelShare</div><h1>Collaborative Excel</h1><p class="muted">Secure sign-in with user-level editing history.</p><div class="auth-tabs"><button id="loginTab" class="active">Sign In</button><button id="signupTab">Create Account</button></div><input id="authEmail" type="email" placeholder="Email address"><input id="authPassword" type="password" placeholder="Password"><input id="authName" class="signup-only hidden" type="text" placeholder="Your name"><button id="authBtn" class="primary">Sign In</button><div id="authMessage" class="auth-message"></div></div></div>
<div id="appScreen" class="app-screen hidden">
<header class="topbar"><div class="brand">▦ ExcelShare</div>
<nav class="menus">
<label>File <input id="openComputer" type="file" accept=".xlsx,.xls" hidden><button onclick="document.getElementById('openComputer').click()">Open Computer</button><button id="openDrive">Google Drive</button><button id="openSupabase">Supabase</button></label>
<label>Edit <button id="undoBtn">Undo</button><button id="redoBtn">Redo</button></label>
<label>Format <button id="boldBtn"><b>B</b></button><button id="italicBtn"><i>I</i></button><button id="underlineBtn"><u>U</u></button><input id="fontColor" type="color" title="Font colour"><input id="cellColor" type="color" title="Cell background"><select id="fontSize"><option value="10">10</option><option value="11" selected>11</option><option value="12">12</option><option value="14">14</option><option value="16">16</option><option value="18">18</option></select><button id="alignLeft">L</button><button id="alignCenter">C</button><button id="alignRight">R</button></label>
<label>Lock <button id="lockCellBtn">Cell</button><button id="lockRowBtn">Row</button><button id="lockColBtn">Column</button><button id="unlockBtn">Unlock</button></label>
<label>View <button id="wrapBtn">Wrap</button><button id="freezeBtn">Freeze</button><button id="historyBtn">History</button><button id="exportBtn">Export XLSX</button></label>
</nav><div class="user-area"><strong id="workbookTitle">Workbook</strong><span id="userBadge"></span><button id="signOutBtn">Sign out</button></div></header>
<div class="formula-bar"><input id="nameBox" value="A1"><span class="fx">fx</span><input id="formulaBar" placeholder="Select a cell..."></div>
<main><div class="spreadsheet-container"><div id="spreadsheet" tabindex="0"></div></div><aside id="historyPanel" class="history-panel hidden"><div class="history-header"><strong>Edit History</strong><button id="closeHistory">×</button></div><div id="historyList"></div></aside></main><footer id="sheetTabs" class="sheet-tabs"></footer></div>
<script type="module" src="app.js"></script></body></html>
